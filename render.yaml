services:
  - type: web
    name: careers-portal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: MONGO_URL
        sync: false # Set manually in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: RESUME_ENCRYPTION_KEY
        sync: false # Set manually in dashboard
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel URL
